<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/brand/aspirantai-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080D1B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AspirantAI — All-India Exam Preparation, Coding & Career Platform</title>
    <meta name="description" content="Prepare Smarter. Practice Better. Succeed Together. AI-powered preparation for UPSC, State PSC, GATE, Coding, Internships, Placements, and Class 10 & 12 Board exams." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aspirantai_theme');
          var active = saved || 'dark';
          if (saved === 'system') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            active = prefersDark ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (active === 'dark') {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-electric-blue selection:text-white min-h-screen overflow-x-hidden transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
