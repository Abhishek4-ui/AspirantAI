<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 3D Polyhedron / Diamond Icon -->
  <g transform="translate(10, 10)">
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="url(#primaryGrad)" opacity="0.9" />
    <polygon points="40,5 75,25 40,45 5,25" fill="#00F5D4" opacity="0.6" />
    <polygon points="40,45 75,25 75,65 40,85" fill="#0066FF" opacity="0.8" />
    <polygon points="40,45 5,25 5,65 40,85" fill="#9D4EDD" opacity="0.8" />
    <!-- Core sparkle -->
    <circle cx="40" cy="45" r="7" fill="#FFFFFF" filter="url(#glow)" />
  </g>
  <text x="105" y="58" font-family="Outfit, Inter, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Aspirant<tspan fill="#00D4FF">AI</tspan>
  </text>
  <text x="108" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
    PREPARE SMARTER • SUCCEED TOGETHER
  </text>
</svg>